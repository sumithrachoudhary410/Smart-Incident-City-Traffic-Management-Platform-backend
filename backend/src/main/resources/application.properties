
spring.application.name=smart-city-platform
server.port=${PORT:8081}

# Database Configuration (Defaults to in-memory H2 for local dev, supports MySQL/Postgres in Railway)
# Railway MySQL provides MYSQL_URL or separate MYSQLUSER/MYSQLPASSWORD/MYSQLHOST/etc.
spring.datasource.url=${MYSQL_URL:${DB_URL:${DATABASE_URL:jdbc:h2:mem:testdb}}}
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:sa}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.throw-exception-if-no-handler-found=true

# JWT Authentication
jwt.secret=${JWT_SECRET:Z3Vlc3MtbG9uZy1zZWN1cmUtdG9rZW4tYXNzZXNzbWlzc2V5MTIzNDU2}
jwt.expiration-ms=86400000

# Other Settings
spring.messages.basename=messages
spring.output.ansi.enabled=always